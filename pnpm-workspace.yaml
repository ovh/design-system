packages:
  - "packages/examples/*"
  - "packages/ods-react"
  - "packages/ods-react/src/components/*"
  - "packages/ods-recipes"
  - "packages/ods-recipes/src/components/*"
  - "packages/storybook"
  - "packages/themes"

allowBuilds:
  '@parcel/watcher': false
  esbuild: true
  husky: true
  nx: true
  puppeteer: true
  sharp: true
  unrs-resolver: true

# Only takes effect if `minimumReleaseAge` is enabled (not set in the repo today —
# kept so an eventual CI/global activation does not block these pinned versions).
minimumReleaseAgeExclude:
  - '@playwright/test@1.61.1'
  - playwright-core@1.61.1
  - playwright@1.61.1
  - webpack@5.108.2

overrides:
  # Pin a single @types/react version tree-wide: pnpm's strict node_modules exposed duplicate
  # copies that yarn's hoisting had masked (added in the pnpm migration, 69f19f1ac).
  # Re-pinned to 19.x with the React 19 upgrade; remove once the tree resolves to a single
  # @types/react version on its own.
  "@types/react": "19.2.17"
  "@types/react-dom": "19.1.1"
  # jest-puppeteer (incl. latest v11) still pins jest-environment-node@^29, whose
  # jest-mock@29 is incompatible with the jest@30 runtime (clearMocksOnScope).
  # Force the jest-30 environment so the e2e puppeteer suite runs under jest 30.
  # REMOVE WHEN: jest-environment-puppeteer ships a release depending on jest-environment-node@^30.
  "jest-environment-node": "30.4.1"
  # stylelint-config-concentric-order@5.5.0 still pins stylelint-order@^7 (stylelint <=16).
  # Force stylelint-order@8 so concentric-order works with stylelint 17.
  # REMOVE WHEN: stylelint-config-concentric-order ships a release pinning stylelint-order@^8.
  "stylelint-order": "8.1.1"
  # TODO(storybook-9): retirer ce pin React une fois migré vers Storybook 9/10.
  # SB 8.6 ne tourne pas sous React 19 (bug manager connu, storybook#32095 / #29805) ;
  # l'isolation "manager seul en React 18" est impossible — re-vérifié post-toolchain (2026-07-15) :
  # même sans pin global, les addons du manager importent ods-react et tirent son react 19
  # dans le bundle manager (react error #31). Pin React 18 global en attendant ; les apps
  # d'exemples retombent donc aussi en 18 en local (compromis assumé jusqu'à la migration SB).
  "react": "18.2.0"
  "react-dom": "18.2.0"

patchedDependencies:
  '@fluentui/storybook-llms-extractor@0.0.3': patches/@fluentui__storybook-llms-extractor@0.0.3.patch
